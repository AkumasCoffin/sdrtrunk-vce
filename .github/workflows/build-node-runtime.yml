name: Build node runtime

# Builds the headless sdrtrunk-vce jlink runtime (the fork's control-server build)
# for the feeder-node agent and attaches it to a GitHub Release. The feeder
# node-versions.json manifest points at these assets.
#
# Triggers:
#   - release: published -> attaches the runtime to that release
#   - workflow_dispatch  -> builds + attaches to a rolling "node-runtime" release
#
# Uses BellSoft Liberica "full" JDK 25 (bundles JavaFX), matching the Java 25
# toolchain this build expects (see build.gradle), both as the compile toolchain
# (via JAVA_HOME auto-detect) and as the runtime the jlink image bundles.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: sdrtrunk-linux-amd64.zip
            jdk_url: https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-linux-amd64-full.tar.gz
          - os: windows-latest
            asset: sdrtrunk-windows-amd64.zip
            jdk_url: https://download.bell-sw.com/java/25.0.1+11/bellsoft-jdk25.0.1+11-windows-amd64-full.zip
    runs-on: ${{ matrix.os }}
    steps:
      # The control-server code lives on feature/node-control, but release/
      # dispatch triggers run the workflow from the default branch — so always
      # build the feature branch explicitly. Update this when it's merged.
      - uses: actions/checkout@v4
        with:
          ref: feature/node-control

      - name: Install Liberica full JDK 25 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "${{ matrix.jdk_url }}" -o jdk.tar.gz
          mkdir -p "$HOME/jdk"
          tar -xzf jdk.tar.gz -C "$HOME/jdk" --strip-components=1
          echo "JAVA_HOME=$HOME/jdk" >> "$GITHUB_ENV"

      - name: Install Liberica full JDK 25 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL "${{ matrix.jdk_url }}" -o jdk.zip
          Expand-Archive jdk.zip -DestinationPath "$env:USERPROFILE\jdkx"
          $root = (Get-ChildItem "$env:USERPROFILE\jdkx" -Directory | Select-Object -First 1).FullName
          "JAVA_HOME=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build node runtime (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew nodeRuntimeZip --no-daemon --no-configuration-cache --stacktrace

      - name: Build node runtime (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: gradlew.bat nodeRuntimeZip --no-daemon --no-configuration-cache --stacktrace

      - name: Package + hash (Linux)
        if: runner.os == 'Linux'
        run: |
          ZIP="build/node-dist/${{ matrix.asset }}"
          echo "artifact zip: $ZIP"
          test -f "$ZIP"
          cp "$ZIP" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - name: Package + hash (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "build/node-dist/${{ matrix.asset }}"
          Write-Host "artifact zip: $zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          Copy-Item $zip "${{ matrix.asset }}"
          $h = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || 'node-runtime' }}
          name: ${{ github.event.release.name || 'Node runtime (rolling)' }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
